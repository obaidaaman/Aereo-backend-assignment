version: '3.8'

services:
  #  FastAPI 
  api:
    build: .
    container_name: aereo-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      
      - ./certificates:/app/certificates

  # Celery
  worker:
    build: .
    container_name: aereo-worker
    command: celery -A celery_worker worker --loglevel=info
    env_file:
      - .env
    volumes:
     
      - ./certificates:/app/certificates
    depends_on:
      - api
